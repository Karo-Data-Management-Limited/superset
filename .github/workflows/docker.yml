name: Build & publish docker images

on:
  push:
    branches:
      # Upstream sync branch - builds disabled to avoid conflicts
      # - "master"
      # Development branch - builds enabled for testing
      - "develop"
      # Release branches - builds enabled for release candidates
      - "release/*"
      # Production branch - builds enabled for stable releases
      - "production"
      # Version branches for upstream compatibility
      - "[0-9].[0-9]*"
    tags:
      # Build on version tags (e.g., v1.0.0, v1.1.0-rc.1)
      - "v*"
  pull_request:
    branches:
      - "develop"
      - "production"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:

  setup_matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix_config: ${{ steps.set_matrix.outputs.matrix_config }}
    steps:
      - id: set_matrix
        run: |
          MATRIX_CONFIG=$(if [ "${{ github.event_name }}" == "pull_request" ]; then echo '["dev", "lean"]'; else echo '["dev", "lean", "py310", "websocket", "dockerize", "py311", "py312"]'; fi)
          echo "matrix_config=${MATRIX_CONFIG}" >> $GITHUB_OUTPUT
          echo $GITHUB_OUTPUT

  docker-build:
    name: docker-build
    needs: setup_matrix
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_preset: ${{fromJson(needs.setup_matrix.outputs.matrix_config)}}
      fail-fast: false
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_TAG: apache/superset:GHA-${{ matrix.build_preset }}-${{ github.run_id }}
      GHCR_IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/superset:GHA-${{ matrix.build_preset }}-${{ github.run_id }}

    steps:

      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check for file changes
        id: check
        uses: ./.github/actions/change-detector/
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Environment
        if: steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker
        uses: ./.github/actions/setup-docker
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          build: "true"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && (steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup supersetbot
        if: steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker
        uses: ./.github/actions/setup-supersetbot/

      - name: Build Docker Image
        if: steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Single platform builds in pull_request context to speed things up
          if [ "${{ github.event_name }}" = "push" ]; then
            PLATFORM_ARG="--platform linux/arm64 --platform linux/amd64"
            # can only --load images in single-platform builds
            PUSH_OR_LOAD="--push"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            PLATFORM_ARG="--platform linux/amd64"
            PUSH_OR_LOAD="--load"
          fi

          supersetbot docker \
            $PUSH_OR_LOAD \
            --preset ${{ matrix.build_preset }} \
            --context "$EVENT" \
            --context-ref "$RELEASE" $FORCE_LATEST \
            --extra-flags "--build-arg INCLUDE_CHROMIUM=false --tag $IMAGE_TAG" \
            $PLATFORM_ARG

      # in the context of push (using multi-platform build), we need to pull the image locally
      - name: Docker pull
        if: github.event_name == 'push' && (steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker)
        run:  docker pull $IMAGE_TAG

      # Tag and push to GitHub Container Registry
      - name: Tag and Push to GHCR
        if: github.event_name == 'push' && (steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker)
        run: |
          docker tag $IMAGE_TAG $GHCR_IMAGE_TAG
          docker push $GHCR_IMAGE_TAG

          # Determine branch/tag-specific tagging strategy
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Git tag (version release): tag with version number
            VERSION="${GITHUB_REF#refs/tags/}"
            GHCR_VERSION_TAG=ghcr.io/${{ github.repository_owner }}/superset:${VERSION}-${{ matrix.build_preset }}
            docker tag $IMAGE_TAG $GHCR_VERSION_TAG
            docker push $GHCR_VERSION_TAG

            if [ "${{ matrix.build_preset }}" = "lean" ]; then
              GHCR_VERSION_LEAN_TAG=ghcr.io/${{ github.repository_owner }}/superset:${VERSION}
              docker tag $IMAGE_TAG $GHCR_VERSION_LEAN_TAG
              docker push $GHCR_VERSION_LEAN_TAG

              # Also tag as latest for non-RC versions
              if [[ ! "$VERSION" =~ -rc\. ]]; then
                GHCR_LATEST_TAG=ghcr.io/${{ github.repository_owner }}/superset:latest
                docker tag $IMAGE_TAG $GHCR_LATEST_TAG
                docker push $GHCR_LATEST_TAG
              fi
            fi

          else
            # Branch-based tagging
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"

            if [[ "$BRANCH_NAME" == "develop" ]]; then
              # Development branch: tag as develop-<preset>
              GHCR_BRANCH_TAG=ghcr.io/${{ github.repository_owner }}/superset:develop-${{ matrix.build_preset }}
              docker tag $IMAGE_TAG $GHCR_BRANCH_TAG
              docker push $GHCR_BRANCH_TAG

              # Also tag as 'develop' for lean preset
              if [ "${{ matrix.build_preset }}" = "lean" ]; then
                GHCR_DEVELOP_TAG=ghcr.io/${{ github.repository_owner }}/superset:develop
                docker tag $IMAGE_TAG $GHCR_DEVELOP_TAG
                docker push $GHCR_DEVELOP_TAG
              fi

            elif [[ "$BRANCH_NAME" == release/* ]]; then
              # Release branch: tag as rc-<version>-<preset>
              VERSION="${BRANCH_NAME#release/}"
              GHCR_RC_TAG=ghcr.io/${{ github.repository_owner }}/superset:rc-${VERSION}-${{ matrix.build_preset }}
              docker tag $IMAGE_TAG $GHCR_RC_TAG
              docker push $GHCR_RC_TAG

              # Also tag as rc-<version> for lean preset
              if [ "${{ matrix.build_preset }}" = "lean" ]; then
                GHCR_RC_LEAN_TAG=ghcr.io/${{ github.repository_owner }}/superset:rc-${VERSION}
                docker tag $IMAGE_TAG $GHCR_RC_LEAN_TAG
                docker push $GHCR_RC_LEAN_TAG
              fi

            elif [[ "$BRANCH_NAME" == "production" ]]; then
              # Production branch: tag as preset name
              GHCR_PRESET_TAG=ghcr.io/${{ github.repository_owner }}/superset:${{ matrix.build_preset }}
              docker tag $IMAGE_TAG $GHCR_PRESET_TAG
              docker push $GHCR_PRESET_TAG

              # Tag as 'stable' for lean preset (use 'stable' instead of 'latest' for branch)
              if [ "${{ matrix.build_preset }}" = "lean" ]; then
                GHCR_STABLE_TAG=ghcr.io/${{ github.repository_owner }}/superset:stable
                docker tag $IMAGE_TAG $GHCR_STABLE_TAG
                docker push $GHCR_STABLE_TAG
              fi
            fi
          fi

      - name: Print docker stats
        if: steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "IMAGE: $IMAGE_TAG"
          echo "GHCR IMAGE: $GHCR_IMAGE_TAG"
          docker images $IMAGE_TAG
          docker history $IMAGE_TAG

      # Scan for vulnerabilities in built container image after pushes to mainline branch.
      - name: Run Trivy container image vulnerabity scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && (steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker) && matrix.build_preset == 'lean'
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
      - name: Upload Trivy scan results to GitHub Security tab
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && (steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker) && matrix.build_preset == 'lean'
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e # v4.31.8
        with:
          sarif_file: 'trivy-results.sarif'

      - name: docker-compose sanity check
        if: (steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker) && matrix.build_preset == 'dev'
        shell: bash
        run: |
          export SUPERSET_BUILD_TARGET=${{ matrix.build_preset }}
          # This should reuse the CACHED image built in the previous steps
          docker compose build superset-init --build-arg DEV_MODE=false --build-arg INCLUDE_CHROMIUM=false
          docker compose up superset-init --exit-code-from superset-init

  docker-compose-image-tag:
    # Run this job only on pushes to master (not for PRs)
    # goal is to check that building the latest image works, not required for all PR pushes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check for file changes
        id: check
        uses: ./.github/actions/change-detector/
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Docker Environment
        if: steps.check.outputs.docker
        uses: ./.github/actions/setup-docker
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          build: "false"
          install-docker-compose: "true"
      - name: docker-compose sanity check
        if: steps.check.outputs.docker
        shell: bash
        run: |
          docker compose -f docker-compose-image-tag.yml up superset-init --exit-code-from superset-init
