name: Embedded authoring regression

on:
  pull_request:
    paths:
      - 'superset-frontend/src/explore/components/DatasourcePanel/**'
      - 'superset-frontend/packages/mf-embed/**'
      - 'superset-frontend/package-lock.json'
      - '.github/workflows/embedded-authoring-checks.yml'

permissions:
  contents: read

jobs:
  dataset-control:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: superset-frontend
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: superset-frontend/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit
      - run: npx jest --runInBand src/explore/components/DatasourcePanel/DatasourcePanel.test.tsx packages/mf-embed/src/EmbeddedExploreNavigation.test.tsx
