# Example values file for deploying Superset using GitHub Container Registry (GHCR)
#
# This file demonstrates how to deploy Superset using custom-built images
# from GitHub Container Registry instead of the default DockerHub images.
#
# Usage:
#   helm install superset ./helm/superset -f ./helm/superset/examples/ghcr-values.yaml
#
# Or with additional custom values:
#   helm install superset ./helm/superset \
#     -f ./helm/superset/examples/ghcr-values.yaml \
#     -f your-custom-values.yaml

# Configure the main Superset image from GHCR
image:
  # Replace 'YOUR_ORG' with your GitHub organization or username
  repository: ghcr.io/YOUR_ORG/superset
  # Use 'latest' for the most recent build, or specify a version/tag
  # Available tags: latest, lean, dev, py310, py311, py312, websocket, dockerize
  tag: latest
  pullPolicy: Always  # Set to Always to ensure you get the latest image

# Configure the init container image from GHCR
initImage:
  repository: ghcr.io/YOUR_ORG/superset
  tag: dockerize
  pullPolicy: Always

# If your GHCR repository is private, you'll need to create an image pull secret
# First, create the secret in your Kubernetes cluster:
#
#   kubectl create secret docker-registry ghcr-secret \
#     --docker-server=ghcr.io \
#     --docker-username=YOUR_GITHUB_USERNAME \
#     --docker-password=YOUR_GITHUB_PAT \
#     --docker-email=YOUR_EMAIL
#
# Then uncomment and use it:
# imagePullSecrets:
#   - name: ghcr-secret

# Example: Using a specific build tag instead of 'latest'
# image:
#   repository: ghcr.io/YOUR_ORG/superset
#   tag: GHA-lean-1234567890  # Specific GitHub Actions run ID
#   pullPolicy: IfNotPresent

# Example: Using different presets for different components
# The build process creates several image variants:
# - lean: Minimal production image (recommended for production)
# - dev: Development image with additional tools
# - py310/py311/py312: Python version-specific builds
# - websocket: WebSocket server for real-time features
# - dockerize: Initialization utilities

# Note: After building images via GitHub Actions, they will be available at:
#   ghcr.io/<YOUR_ORG>/superset:latest         (latest lean build on master)
#   ghcr.io/<YOUR_ORG>/superset:lean           (latest lean preset)
#   ghcr.io/<YOUR_ORG>/superset:dev            (latest dev preset)
#   ghcr.io/<YOUR_ORG>/superset:GHA-<preset>-<run_id>  (specific build)
